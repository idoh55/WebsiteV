<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מפת האתר — I do</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=David+Libre:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f6f1e7; --cream-2:#efe7d8; --ink:#1c1712; --ink-soft:#3a322a;
    --rust:#D6455C; --rust-dark:#A8283D; --line:rgba(28,23,18,0.12);
    --radius:22px; --ease:cubic-bezier(.16,.84,.44,1);
    --font-serif:'David Libre', serif; --font-sans:'Rubik', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;line-height:1.6;}
  a{color:var(--rust-dark);text-decoration:underline;text-underline-offset:2px;}
  .container{max-width:760px;margin:0 auto;padding:0 24px;}
  header{padding:28px 0;border-bottom:1px solid var(--line);}
  header .inner{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-family:var(--font-serif);font-weight:600;font-size:22px;color:var(--ink);text-decoration:none;}
  .logo .dot{color:var(--rust);}
  .back-link{font-size:13.5px;font-weight:500;color:var(--ink-soft);text-decoration:none;display:flex;align-items:center;gap:6px;}
  .back-link:hover{color:var(--rust-dark);}
  .header-right{display:flex;align-items:center;gap:16px;}
  .lang-switch-mini{display:flex;gap:6px;}
  .lang-switch-mini a{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:100px;border:1.5px solid var(--line);color:var(--ink-soft);text-decoration:none;transition:background .2s,color .2s,border-color .2s;}
  .lang-switch-mini a.active{background:var(--ink);color:var(--cream);border-color:var(--ink);}
  .lang-switch-mini a:not(.active):hover{border-color:var(--ink-soft);color:var(--ink);}
  :focus-visible{outline:2px solid var(--rust-dark);outline-offset:2px;}
  .skip-link{position:absolute;top:-100px;left:12px;z-index:100;background:var(--ink);color:var(--cream);padding:12px 20px;border-radius:10px;font-weight:600;font-size:14px;text-decoration:none;transition:top .2s var(--ease);}
  html[dir="rtl"] .skip-link{left:auto;right:12px;}
  .skip-link:focus{top:12px;}
  main{padding:56px 0 100px;}
  h1{font-family:var(--font-serif);font-weight:600;font-size:clamp(30px,5vw,42px);margin:0 0 40px;}
  h2{font-family:var(--font-serif);font-weight:600;font-size:18px;margin:36px 0 14px;color:var(--ink-soft);}
  ul{list-style:none;margin:0;padding:0;}
  li{margin-bottom:4px;}
  li a{display:block;padding:11px 0;font-size:15.5px;border-bottom:1px solid var(--line);}
  li a:hover{color:var(--rust-dark);}
  footer{border-top:1px solid var(--line);padding:32px 0;text-align:center;font-size:13px;color:var(--ink-soft);opacity:0.7;}
</style>
</head>
<body>

<a href="#main" class="skip-link">דלג לתוכן הראשי</a>

<header>
  <div class="container inner">
    <a href="index.html#top" class="logo">i do<span class="dot">.</span></a>
    <div class="header-right">
      <div class="lang-switch-mini">
        <a href="sitemap.html" class="active" aria-current="page">עברית</a>
        <a href="sitemap-en.html" hreflang="en">EN</a>
      </div>
      <a href="index.html" class="back-link">← בחזרה לאתר</a>
    </div>
  </div>
</header>

<main id="main" tabindex="-1">
  <div class="container">
    <h1>מפת האתר</h1>

    <h2>עמוד הבית</h2>
    <ul>
      <li><a href="index.html#top">דף הבית</a></li>
      <li><a href="index.html#coffee">התפריט</a></li>
      <li><a href="index.html#story">הסיפור</a></li>
      <li><a href="index.html#join">הצטרפות לרשימת התפוצה</a></li>
    </ul>

    <h2>מידע משפטי</h2>
    <ul>
      <li><a href="terms.html">תקנון האתר</a></li>
      <li><a href="returns.html">מדיניות ביטול והחזרות</a></li>
      <li><a href="privacy.html">מדיניות פרטיות</a></li>
      <li><a href="accessibility.html">הצהרת נגישות</a></li>
    </ul>

    <h2>עוד</h2>
    <ul>
      <li><a href="contact.html">צרו קשר</a></li>
    </ul>
  </div>
</main>

<footer>
  <div class="container">© 2026 I do Coffee Roastery. כל הזכויות שמורות.</div>
</footer>

</body>
</html>
